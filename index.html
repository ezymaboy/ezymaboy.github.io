<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@ezymaboy — AI Filmmaker & Content Creator</title>
  <meta name="description" content="Cinematic AI short films & visual storytelling by @ezymaboy. Watch on TikTok, follow on Instagram and X, or DM for collaborations & commissions.">
  <style>
    :root {
      --bg: #0b0f0e;
      --surface: #131a18;
      --surface-hover: #1a2421;
      --border: #26332e;
      --text: #eef4f1;
      --text-light: #93a69d;
      --accent: #34d399;
      --radius: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(120% 60% at 50% 0%, #12211c 0%, var(--bg) 55%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .bio-container {
      width: 100%;
      max-width: 480px;
      padding: 48px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-placeholder {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 3px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin-bottom: 16px;
    }
    .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; text-align: center; }
    .profile-tagline {
      font-size: 15px; color: var(--text-light);
      text-align: center; margin-bottom: 32px;
      line-height: 1.5; max-width: 360px;
    }
    .category-label {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent);
      margin: 8px 0 12px; width: 100%;
      text-align: left; padding-left: 4px;
    }
    .link-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .link-item {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 15px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }
    .link-item:hover { background: var(--surface-hover); border-color: var(--accent); transform: translateY(-1px); }
    .link-item:active { transform: translateY(0); }
    .link-icon { font-size: 20px; flex-shrink: 0; }
    .link-label { font-size: 15px; font-weight: 500; flex-grow: 1; }
    .link-sub { display: block; font-size: 12px; color: var(--text-light); font-weight: 400; margin-top: 2px; }
    .link-arrow { font-size: 14px; color: var(--text-light); flex-shrink: 0; }
    .spacer { height: 18px; }
    .bio-footer { margin-top: 44px; text-align: center; font-size: 12px; color: var(--text-light); }
    @media (max-width: 480px) {
      .bio-container { padding: 32px 16px 24px; }
      .link-item { padding: 14px 16px; }
    }
    @supports (-webkit-touch-callout: none) { body { min-height: -webkit-fill-available; } }
  </style>
</head>
<body>
  <div class="bio-container">

    <div class="avatar-placeholder">🎬</div>

    <h1 class="profile-name">@ezymaboy</h1>
    <p class="profile-tagline">AI Filmmaker &amp; Content Creator<br>Cinematic short films &amp; visual storytelling</p>

    <div class="category-label">Watch</div>
    <div class="link-list">
      <a href="https://www.tiktok.com/@ezymaboy" target="_blank" rel="noopener" class="link-item">
        <span class="link-icon">🎵</span>
        <span class="link-label">TikTok<span class="link-sub">My films &amp; series live here</span></span>
        <span class="link-arrow">→</span>
      </a>
    </div>

    <div class="spacer"></div>

    <div class="category-label">Connect</div>
    <div class="link-list">
      <a href="https://www.instagram.com/ezymaboy" target="_blank" rel="noopener" class="link-item">
        <span class="link-icon">📸</span>
        <span class="link-label">Instagram</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://x.com/taufikhida16585" target="_blank" rel="noopener" class="link-item">
        <span class="link-icon">𝕏</span>
        <span class="link-label">X (Twitter)</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://ig.me/m/ezymaboy" target="_blank" rel="noopener" class="link-item">
        <span class="link-icon">📩</span>
        <span class="link-label">Business Inquiries<span class="link-sub">Collaborations &amp; commissions — DM me</span></span>
        <span class="link-arrow">→</span>
      </a>
    </div>

    <div class="bio-footer">
      <p>© 2026 ezymaboy</p>
    </div>

  </div>
</body>
</html>
